<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.browser_title | default: page.title | escape }}{% unless page.browser_title %} | {{ site.title | escape }}{% endunless %}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
  {% if page.lightbox %}<script src="{{ '/js/scripts.js' | relative_url }}" defer></script>{% endif %}
</head>
