---
layout: default
---
<section class="section">
    <h2 class="section-header">{{ page.heading | escape }}</h2>
    {{ content }}
    {% assign entries = site[page.collection] | sort: 'order' %}
    {% for entry in entries %}{% include note-card.html item=entry %}{% else %}<p>{{ page.empty_message | escape }}</p>{% endfor %}
</section>
