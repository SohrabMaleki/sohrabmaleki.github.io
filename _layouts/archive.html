---
layout: default
---
<header class="page-heading">
  <h1>{{ page.heading | escape }}</h1>
  <div class="prose">{{ content }}</div>
</header>
{% assign entries = site[page.collection] | sort: 'order' %}
{% for entry in entries %}{% include entry.html item=entry %}{% else %}<p>{{ page.empty_message | escape }}</p>{% endfor %}
